<text x="60" y="850" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#58667A">Uncovered executable UAF controls: RSH-003 and RSH-019 are same-object/pre-reuse races; RSH-075 uses SQLite&#x27;s C allocator.</text>
<text x="1540" y="878" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#7C8798">RSH-006 is excluded because the dangling target is stack storage, outside the heap allocator scope.</text>
