<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Incremental effect of enabling large-page allocation</title>
  <desc id="chart-description">Paired change within each allocator; points are estimates and whiskers are confidence intervals</desc>
