<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Causal decomposition of the lifetime-aware allocation feature</title>
  <desc id="desc">The lifetime layout reduces steady resident memory but adds lifecycle cost; selective THP recovers lifecycle performance and produces the combined feature result.</desc>
  <defs>
    <style>
      text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; fill: #17202A; }
      .muted { fill: #566573; }
      .card { fill: #F8FAFC; stroke: #D5DBDB; stroke-width: 2; }
      .stage { font-size: 25px; font-weight: 800; }
      .body { font-size: 16px; }
      .small { font-size: 13px; }
      .effect { font-size: 18px; font-weight: 800; }
      .hero { font-size: 32px; font-weight: 800; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7F8C8D"/>
    </marker>
  </defs>
  <rect id="background" x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="55" y="62" font-size="39" font-weight="800">Lifetime-aware feature: causal decomposition</text>
  <text x="55" y="103" font-size="20" class="muted">Default → lifetime layout with physical THP forced off → lifetime layout with selective THP</text>

  <g id="default-stage">
    <rect class="card" x="50" y="165" width="360" height="340" rx="18"/>
    <rect x="50" y="165" width="360" height="12" rx="6" fill="#7F8C8D"/>
    <text x="78" y="224" class="stage">1. Default</text>
    <text x="78" y="262" class="body muted">raw GlobalAlloc path</text>
    <line x1="78" y1="286" x2="382" y2="286" stroke="#D5DBDB"/>
    <text x="78" y="334" class="effect">57.509 ns/touch</text>
    <text x="78" y="365" class="small muted">dependent-pointer median</text>
    <text x="78" y="416" class="effect">1553.2 ns/allocation</text>
    <text x="78" y="447" class="small muted">allocate/fault/free median</text>
    <text x="78" y="485" class="small muted">baseline for the full feature effect</text>
  </g>

  <line x1="420" y1="335" x2="575" y2="335" stroke="#7F8C8D" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="235" text-anchor="middle" class="effect" fill="#0072B2">+7.28% touch</text>
  <text x="500" y="262" text-anchor="middle" class="small muted">95% CI [+5.65, +8.80]</text>
  <text x="500" y="302" text-anchor="middle" class="effect" fill="#009E73">−8.35% steady</text>
  <text x="500" y="389" text-anchor="middle" class="effect" fill="#C0392B">−22.70% lifecycle</text>
  <text x="500" y="416" text-anchor="middle" class="small muted">layout-path cost</text>

  <g id="layout-stage">
    <rect class="card" x="590" y="165" width="420" height="340" rx="18"/>
    <rect x="590" y="165" width="420" height="12" rx="6" fill="#0072B2"/>
    <text x="618" y="224" class="stage">2. Lifetime layout</text>
    <text x="618" y="262" class="body muted">same long-thp policy · process THP disabled</text>
    <line x1="618" y1="286" x2="982" y2="286" stroke="#D5DBDB"/>
    <text x="618" y="334" class="effect">53.262 ns/touch</text>
    <text x="618" y="365" class="small muted">0 MiB actual THP</text>
    <text x="618" y="416" class="effect">1907.4 ns/allocation</text>
    <text x="618" y="447" class="small muted">same layout and topology as THP-on</text>
    <rect x="618" y="468" width="250" height="24" rx="7" fill="#EAF4FA"/>
    <text x="743" y="485" text-anchor="middle" class="small" fill="#0072B2">physical-backing causal control</text>
  </g>

  <line x1="1020" y1="335" x2="1160" y2="335" stroke="#7F8C8D" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1090" y="235" text-anchor="middle" class="effect" fill="#0072B2">+10.37% touch</text>
  <text x="1090" y="262" text-anchor="middle" class="small muted">95% CI [+6.72, +14.05]</text>
  <text x="1090" y="302" text-anchor="middle" class="effect" fill="#009E73">+31.99% lifecycle</text>
  <text x="1090" y="389" text-anchor="middle" font-size="15" font-weight="800" fill="#E67E22">+0.283% steady cost</text>
  <text x="1090" y="416" text-anchor="middle" class="small muted">258 MiB actual THP</text>

  <g id="selective-stage">
    <rect x="1175" y="165" width="375" height="340" rx="18" fill="#102A43" stroke="#102A43" stroke-width="2"/>
    <rect x="1175" y="165" width="375" height="12" rx="6" fill="#009E73"/>
    <text x="1203" y="224" class="stage" fill="#FFFFFF">3. Selective THP</text>
    <text x="1203" y="262" class="body" fill="#D9E2EC">lifetime layout + long-only THP</text>
    <line x1="1203" y1="286" x2="1522" y2="286" stroke="#486581"/>
    <text x="1203" y="334" class="effect" fill="#66D9C5">48.965 ns/touch</text>
    <text x="1203" y="365" class="small" fill="#D9E2EC">258 MiB actual THP</text>
    <text x="1203" y="416" class="effect" fill="#66D9C5">1298.9 ns/allocation</text>
    <text x="1203" y="447" class="small" fill="#D9E2EC">long-lived cohort receives backing</text>
    <rect x="1203" y="468" width="270" height="24" rx="7" fill="#1F4E68"/>
    <text x="1338" y="485" text-anchor="middle" class="small" fill="#FFFFFF">full lifetime-aware feature</text>
  </g>

  <g id="full-effect">
    <rect x="50" y="555" width="1500" height="244" rx="20" fill="#F4F8F7" stroke="#A9D9CB" stroke-width="2"/>
    <text x="80" y="605" font-size="23" font-weight="800">Full feature vs default</text>
    <text x="80" y="637" class="body muted">20 paired process blocks · 20,000 bootstrap resamples · 95% confidence intervals</text>
    <line x1="430" y1="665" x2="430" y2="770" stroke="#C6DAD4" stroke-width="2"/>
    <line x1="800" y1="665" x2="800" y2="770" stroke="#C6DAD4" stroke-width="2"/>
    <line x1="1170" y1="665" x2="1170" y2="770" stroke="#C6DAD4" stroke-width="2"/>
    <text x="80" y="704" class="hero" fill="#0072B2">+16.90%</text>
    <text x="80" y="733" class="body">dependent-touch</text>
    <text x="80" y="758" class="small muted">CI [+13.50, +20.38]</text>
    <text x="465" y="704" class="hero" fill="#009E73">+16.55%</text>
    <text x="465" y="733" class="body">allocate/fault/free</text>
    <text x="465" y="758" class="small muted">CI [+15.98, +17.09]</text>
    <text x="835" y="704" class="hero" fill="#009E73">−8.09%</text>
    <text x="835" y="733" class="body">steady resident</text>
    <text x="835" y="758" class="small muted">CI [−8.59, −7.61]</text>
    <text x="1205" y="704" class="hero" fill="#E67E22">+0.072%</text>
    <text x="1205" y="733" class="body">peak resident cost</text>
    <text x="1205" y="758" class="small muted">CI [+0.049, +0.092]</text>
  </g>

  <text x="800" y="850" text-anchor="middle" font-size="15" class="muted">Positive performance values mean lower latency. Lifecycle includes allocation, first-byte fault, free, wave, and teardown. Single-host synthetic trace.</text>
</svg>
