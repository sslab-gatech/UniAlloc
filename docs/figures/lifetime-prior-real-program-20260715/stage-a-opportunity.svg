  <text x="800.0" y="825.0" font-size="13.0" font-weight="400" text-anchor="middle" fill="#566573">Stage A uses force tracking and the process-wide requested-generation clock.</text>
  <text x="800.0" y="850.0" font-size="13.0" font-weight="400" text-anchor="middle" fill="#566573">Completed outcomes form the bars; live right-censored bytes stay outside their denominators.</text>
  <text x="800.0" y="875.0" font-size="13.0" font-weight="400" text-anchor="middle" fill="#566573">Opportunity and classifier diagnostics stay in Stage A; speed, RSS, fragmentation, and resident-THP effects require Stage B.</text>
