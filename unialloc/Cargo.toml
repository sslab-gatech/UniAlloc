[package]
name = "unialloc"
version = "0.1.0"
authors = ["sslab_gatech <sslab@cc.gatech.edu>"]
edition = "2018"
rust-version = "1.64"
autobenches = false

[dependencies]
libc = { version = "=0.2.183", default-features = false }
spin = { version = "=0.9.0" }
alloc_macros = { path = "../alloc_macros" }
mimalloc = { version = "0.1.25", default-features = false, optional = true }

[dev-dependencies]
rand = "0.7"
bencher = "0.1.4"
rand_xorshift = "0.2"
iai = "0.1"
cfg-if = "1.0.0"

[target.'cfg(unix)'.dependencies]
jemallocator = { version = "0.3.2", optional = true }
tcmalloc = { version = "0.3.0", optional = true }
snmalloc-rs = { version = "0.2.27", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "fibersapi", "fileapi", "handleapi", "memoryapi", "minwindef", "processenv", "synchapi", "sysinfoapi", "winbase", "winnt"] }

[build-dependencies]
num_cpus = "=1.13.0"
page_size = "=0.4.2"
libc = "=0.2.183"
cfg_aliases = "=0.1.1"

[[bench]]
name = "std_bench"
path = "benches/lib.rs"
test = true

[[bench]]
name = "semantic_std"
path = "benches/semantic_std.rs"
test = true

[[bench]]
name = "std_bench_compiler_proto_generated"
path = "benches/std_bench_compiler_proto_generated.rs"
test = true

[[bench]]
name = "std_bench_compiler_exact_dynamic_generated"
path = "benches/std_bench_compiler_exact_dynamic_generated.rs"
test = true

[[example]]
name = "pac_metadata_probe_nostd"
path = "examples/pac_metadata_probe_nostd.rs"
test = false
bench = false
required-features = ["pac"]

[features]
default = ["pthread_dtor", "rseq"]
fixed_heap = []
# Opt-in slab-class backend switch: default builds keep efficient_sc.
# When enabled, zone/thread-cache calls are adapted to the bitmap-backed
# separate size-class/page-management path without changing allocator callers.
separate_sc_backend = []
hugepage = []
# Opt-in hosted payload arenas keyed by exact lifetime and size classes.
# Default builds keep the existing allocator path unchanged.
lifetime_hugepage = ["type_isolation"]
rseq = []
pthread_dtor = []
static_dtor = []
bench_jemalloc = ["jemallocator"]
bench_ourself = []
bench_ptmalloc = []
bench_mimalloc = ["mimalloc"]
bench_tcmalloc = ["tcmalloc"]
bench_snmalloc = ["snmalloc-rs"]
bench_scudo = []
allow_mem_leak = []
type_isolation = []
# The paper "metadata_segregation" variant must exercise an allocator path with
# separated size-class/page metadata, not only attach a different semantic flag
# to the same default slab backend.  Keep the backend switch explicit and
# additive: default builds still use efficient_sc, while this feature selects
# the bitmap-backed separate_sc adapter used by C004 validation.
# Semantic policy builds keep address-lifecycle tracking active from process
# start so raw operations cannot race the first policy-bearing operation.
metadata_segregation = ["separate_sc_backend", "type_isolation"]
pac = ["type_isolation"]
mte = ["type_isolation"]
mpk = ["type_isolation"]
guard_pages = ["type_isolation"]
quarantine = ["type_isolation"]
force_initialize = ["type_isolation"]
stats = []

[lib]
doctest = false
