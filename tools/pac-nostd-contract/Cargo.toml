[package]
name = "unialloc_pac_nostd_contract"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unialloc = { path = "../../unialloc", default-features = false }

[features]
default = []
pac = ["unialloc/pac"]
stats = ["unialloc/stats"]

[[bin]]
name = "pac_metadata_probe_nostd"
path = "../../unialloc/examples/pac_metadata_probe_nostd.rs"
test = false
bench = false
required-features = ["pac"]

# Keep this contract probe outside the main workspace.  In particular, this
# makes UniAlloc a normal dependency rather than the package under test, so its
# std-only dev-dependencies cannot enter the no_std target dependency graph.
[workspace]

# This package does not inherit the root workspace profiles.  A no_std binary
# cannot use unwinding, so keep both reusable validation modes explicit here.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
