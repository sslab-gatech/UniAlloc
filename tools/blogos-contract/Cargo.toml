[package]
name = "unialloc_blogos_contract"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "unialloc_blogos_contract"
path = "src/main.rs"
test = false
bench = false
required-features = ["baremetal-contract"]

[features]
default = []
baremetal-contract = []

[dependencies]
unialloc = { path = "../../unialloc", default-features = false, features = ["fixed_heap", "type_isolation"] }

# Keep this target contract outside the root workspace.  UniAlloc is therefore
# built as a dependency and its hosted test/benchmark binaries do not enter the
# bare-metal target graph.
[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
