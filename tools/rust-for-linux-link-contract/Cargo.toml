[package]
name = "unialloc_rust_for_linux_link_contract"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unialloc = { path = "../../unialloc", default-features = false, features = ["fixed_heap", "allow_mem_leak", "stats"] }

# Keep this bare-metal final-crate contract outside the root workspace.  It
# mirrors the Rust-for-Linux module's normal `--extern unialloc=...` linkage
# without requiring a kernel tree or module build environment.
[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
